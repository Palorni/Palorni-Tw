name: Build & Release Palorni Windows Optimizer

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Application
        run: npm run build

      - name: Package Windows Installer
        run: npx electron-builder --win nsis

      - name: Package Windows Portable
        run: npx electron-builder --win zip

      - name: Show Release Files
        shell: powershell
        run: |
          Write-Host "===== CONTEUDO DA PASTA RELEASE ====="

          if (Test-Path "release") {
            Get-ChildItem "release" -Force | ForEach-Object {
              Write-Host $_.Name
              Write-Host "Tamanho: $($_.Length) bytes"
            }
          } else {
            Write-Host "PASTA RELEASE NAO EXISTE!"
            exit 1
          }

          Write-Host ""
          Write-Host "===== PROCURANDO EXE ====="

          Get-ChildItem -Path . -Filter "*.exe" -Recurse -ErrorAction SilentlyContinue |
            Select-Object FullName, Length

      - name: Verify Installer
        shell: powershell
        run: |
          if (-not (Test-Path "release/Palorni-Windows-Optimizer-Setup.exe")) {
            Write-Host "ERRO: O instalador .exe NAO FOI ENCONTRADO!"
            exit 1
          }

          Write-Host "OK: Instalador encontrado!"
          Get-Item "release/Palorni-Windows-Optimizer-Setup.exe"

      - name: Verify Portable
        shell: powershell
        run: |
          if (-not (Test-Path "release/Palorni-Windows-Optimizer-Portable.zip")) {
            Write-Host "ERRO: O ZIP PORTATIL NAO FOI ENCONTRADO!"
            exit 1
          }

          Write-Host "OK: ZIP encontrado!"
          Get-Item "release/Palorni-Windows-Optimizer-Portable.zip"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Palorni Windows Optimizer ${{ github.ref_name }}
          files: |
            release/Palorni-Windows-Optimizer-Setup.exe
            release/Palorni-Windows-Optimizer-Portable.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
