name: Build & Release Palorni Windows Optimizer

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build Application
        run: npm run build

      - name: Build Installer (NSIS)
        run: npx electron-builder --win nsis --publish never

      - name: Build Portable (ZIP)
        run: npx electron-builder --win zip --publish never

      - name: Verify Release Files
        shell: powershell
        run: |
          Write-Host "===== RELEASE FILES ====="

          if (!(Test-Path "release/Palorni-Windows-Optimizer-Setup.exe")) {
            Write-Error "Installer EXE nao foi encontrado!"
            exit 1
          }

          if (!(Test-Path "release/Palorni-Windows-Optimizer-Portable.zip")) {
            Write-Error "Portable ZIP nao foi encontrado!"
            exit 1
          }

          Write-Host "Installer encontrado:"
          Get-Item "release/Palorni-Windows-Optimizer-Setup.exe" |
            Select-Object FullName, Length

          Write-Host "Portable encontrado:"
          Get-Item "release/Palorni-Windows-Optimizer-Portable.zip" |
            Select-Object FullName, Length

          Write-Host "===== BUILD VALIDADO ====="

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Palorni Windows Optimizer ${{ github.ref_name }}
          files: |
            release/Palorni-Windows-Optimizer-Setup.exe
            release/Palorni-Windows-Optimizer-Portable.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
