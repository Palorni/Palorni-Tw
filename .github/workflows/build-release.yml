name: Build & Release Palorni Windows Optimizer

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build

      - name: Package Windows Installer
        run: npx electron-builder --win nsis

      - name: Package Windows Portable
        run: npx electron-builder --win zip

      - name: Show Release Files
        shell: powershell
        run: |
          Write-Host "Arquivos gerados:"
          Get-ChildItem -Path release -Recurse | Select-Object FullName, Length

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Palorni Windows Optimizer ${{ github.ref_name }}
          files: |
            release/Palorni-Windows-Optimizer-Setup.exe
            release/Palorni-Windows-Optimizer-Portable.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
